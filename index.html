/* Layout: coluna única estilo app de celular (máx 560px), resumo da fatura no topo, categorias, lançamentos, botão flutuante + gasto, folhas inferiores para formulários */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface2:#eceef4; --fg:#151821; --muted:#5f6779; --line:#dfe2ea;
  --me:#3b63e6; --her:#d9702a; --goal:#0f9e90; --brand:#2f5be0; --good:#1d8f4e; --warn:#b97a06; --bad:#d23434;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, system-ui, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f14; --surface:#161921; --surface2:#1e222c; --fg:#eef0f6; --muted:#949cb0; --line:#2a2f3b;
  --me:#7591ff; --her:#f3974f; --goal:#2dd4bf; --brand:#7591ff; --good:#3ccf74; --warn:#f2b93b; --bad:#ff5d55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14; --surface:#161921; --surface2:#1e222c; --fg:#eef0f6; --muted:#949cb0; --line:#2a2f3b;
  --me:#7591ff; --her:#f3974f; --goal:#2dd4bf; --brand:#7591ff; --good:#3ccf74; --warn:#f2b93b; --bad:#ff5d55; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-x:hidden;max-width:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:12px 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.proto{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:8px 10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:22px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.invnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.invnav .lbl{text-align:center;min-width:0}
.invnav .lbl b{font-family:var(--display);font-size:18px;display:block}
.invnav .lbl span{font-size:12px;color:var(--muted)}
.closing{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;font-weight:600}
.chip.edit{border-color:color-mix(in srgb,var(--goal) 55%,var(--line));color:var(--goal);background:transparent}
.chip.flag{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:transparent}
.total{margin-top:14px;text-align:center}
.total .v{font-family:var(--display);font-size:38px;letter-spacing:-.5px}
.total .s{font-size:12px;color:var(--muted)}
.split{margin-top:12px;height:10px;border-radius:999px;background:var(--surface2);display:flex;overflow:hidden}
.split i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.secthead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.secthead h2{font-size:17px}
.cats{display:flex;flex-direction:column}
.cat{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0}
.cat .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat .nm{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.cat .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .amt{font-weight:700;white-space:nowrap}
.cat .amt small{font-weight:500;color:var(--muted)}
.track{position:relative;height:12px;border-radius:999px;background:var(--surface2);margin-top:8px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.track .over{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.cat .r3{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.none{color:var(--muted);background:var(--surface2)}
.meta{color:var(--goal);font-weight:600}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .who{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t span{font-size:12.5px;color:var(--muted)}
.it .v{font-weight:700;white-space:nowrap}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:4px}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
.future{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.future div{background:var(--surface2);border-radius:12px;padding:10px}
.future b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.future span{font-weight:700}
.fabg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;background:var(--fg);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:5;overflow:hidden}
.fabg[hidden]{display:none}
.fab,.fab2{border:0;background:transparent;color:var(--bg);font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.fab{padding:15px 24px 15px 18px}
.fab2{padding:15px 16px 15px 22px;border-right:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
.fab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--goal);outline-offset:2px}
.linkbtn{border:0;background:transparent;color:var(--goal);font-weight:600;font-size:13px;padding:4px}
/* folhas */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{font-size:19px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select{width:100%;font:inherit;font-size:16px;min-width:0;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.bigval{font-family:var(--display);font-size:30px;text-align:center;padding:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600}
.catpick button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700}
.stepper input{text-align:center}
.hint{font-size:13px;background:color-mix(in srgb,var(--goal) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--goal) 35%,var(--line));border-radius:12px;padding:10px 12px}
.btns{display:flex;gap:10px}
.btn{flex:1;border-radius:14px;padding:14px;font-weight:700;border:1px solid var(--line);background:var(--surface2)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:transparent}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,128px) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow>*{min-width:0}
.newcat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,140px);gap:8px}
.padread{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px 6px}
.padread span{font-size:13px;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.padread b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.catrow input{padding:10px}
.swatch{width:28px;height:28px;border-radius:50%;border:0}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.small{font-size:12.5px;color:var(--muted)}
.catwrap{border-bottom:1px solid var(--line)}
.catwrap:last-child{border-bottom:0}
.catwrap .cat{border-bottom:0}
.catwrap.sel{background:var(--surface2);border-radius:14px;margin:6px -8px;padding:0 10px;border-bottom-color:transparent}
.catwrap.sel .track{background:var(--surface)}
.catitems{padding:0 0 8px;border-top:1px dashed var(--line)}
.catitems .it .who{width:28px;height:28px;font-size:11px}
.chev{display:inline-block;color:var(--muted);font-size:11px;margin-left:6px;transition:transform .15s}
.catwrap.sel .chev{transform:rotate(180deg)}
.moneyfield{width:100%;font:inherit;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.moneyfield.active{border-color:var(--goal);box-shadow:0 0 0 2px color-mix(in srgb,var(--goal) 30%,transparent)}
.moneyfield.big{font-family:var(--display);font-size:32px;text-align:center;padding:14px}
.moneyfield.sm{padding:10px 8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moneyfield.empty{color:var(--muted)}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.padopen{padding-bottom:300px}
.pad{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad{touch-action:none;user-select:none;-webkit-user-select:none}
.pad button{height:50px;border-radius:12px;border:0;background:var(--surface2);font-size:22px;font-weight:600;touch-action:none;-webkit-touch-callout:none}
.pad button:active{filter:brightness(.92)}
.pad .ok{background:var(--goal);color:#fff;font-size:17px;font-weight:700}
.cardsel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.cardsel::-webkit-scrollbar{display:none}
.cchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.cchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cardsel.sm{margin:10px -16px 0}
.cardsel.sm .cchip{padding:6px 11px;font-size:12.5px;border-radius:999px;background:var(--surface2)}
.cardsel.sm .cchip[aria-pressed="true"]{background:var(--fg)}
.mini{display:inline-block;width:16px;height:11px;border-radius:3px;flex:0 0 auto;vertical-align:-1px}
.mini.big{width:26px;height:18px;border-radius:4px}
.cardrows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cardrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px}
.cardrow .nm{min-width:0}.cardrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardrow .nm span{font-size:12px;color:var(--muted)}
.cardrow .val{text-align:right}.cardrow .val b{display:block}.cardrow .val span{font-size:12px;color:var(--muted)}
.limit{margin-top:14px}.limit .bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}.limit .bar i{display:block;height:100%}
.lr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;gap:8px;flex-wrap:wrap}
.cardname{white-space:nowrap}.cardname .mini{width:12px;height:8px;margin-right:3px}
.cardedit{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cardedit .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.swatch.sq{width:34px;height:24px;border-radius:5px}
.mainpick{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;padding:2px 2px;cursor:pointer}
.mainpick input{width:22px;height:22px;flex:0 0 auto;margin:0;padding:0;accent-color:var(--goal)}
.mainpick small{font-weight:500;color:var(--muted)}
.star{font-size:12px;color:var(--warn);margin-left:2px}
.cchip[aria-pressed="true"] .star{color:inherit}
/* o contorno de "Comprado por" abraça só os botões e cresce com o número de pessoas */
.field>.seg{align-self:flex-start;max-width:100%;flex-wrap:wrap}
/* ---------- topo da marca Gastô ---------- */
.hdr{margin-inline:-16px;margin-top:-12px;padding:16px 16px 58px;background:linear-gradient(135deg,#12b5a2 0%,#2f5be0 58%,#5b3fd6 100%);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;border-radius:0 0 26px 26px}
.hdr::after{content:"";position:absolute;right:-70px;top:-50px;width:230px;height:230px;border-radius:50%;border:30px solid rgba(255,255,255,.08);pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.blogo{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 16px rgba(10,14,40,.25);flex:0 0 auto}
.bword{height:30px;width:auto;display:block}
.brand small{display:block;font-size:12px;opacity:.88;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.hicons{display:flex;gap:6px;flex:0 0 auto}
.hbtn{width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.17);color:#fff;display:grid;place-items:center}
.hbtn svg{width:19px;height:19px}
.hbtn:active{background:rgba(255,255,255,.28)}
.cardsel.hd{margin:0 -16px;position:relative;z-index:1}
.cardsel.hd .cchip{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.cardsel.hd .cchip[aria-pressed="true"]{background:#fff;color:#1d2a6b;border-color:#fff}

.cardsel.hd .cchip[aria-pressed="true"] .star{color:#d4a20c}
.hproto{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:rgba(255,255,255,.85);position:relative;z-index:1;flex-wrap:wrap}
.seg.glass{background:rgba(255,255,255,.14);border-color:transparent}

.seg.glass button[aria-pressed="true"]{background:#fff;color:#1d2a6b}
.card.lift{margin-top:-46px;position:relative;z-index:2;box-shadow:0 14px 30px rgba(10,14,40,.12)}
@media (max-width:380px){.bword{height:26px}.blogo{width:40px;height:40px}.hbtn{width:34px;height:34px}.brand small{font-size:11px}}
.pvs{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:7px;font-size:12.5px;color:var(--muted)}
.pvs b{color:var(--fg);font-weight:600}
.cat .r3{margin-top:4px}
.legend{justify-content:flex-start;gap:6px 16px}
.peoplesel{margin-top:10px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
/* ---------- gráfico anual ---------- */
.chkpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.chkpi>div{min-height:84px;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-width:0;color:#fff;box-shadow:0 6px 16px rgba(15,20,45,.16)}
.chkpi span{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.85);white-space:nowrap}
.chkpi b{font-family:var(--display);font-size:16px;line-height:1.1;color:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.chkpi b i{font-style:normal;font-size:.68em;font-weight:700;opacity:.85;margin-right:2px}
.chkpi small{font-size:11px;color:rgba(255,255,255,.85);font-weight:600;white-space:nowrap}
.chkpi .k1{background:linear-gradient(140deg,#14c2ad,#0c8b7d)}
.chkpi .k2{background:linear-gradient(140deg,#3d6cf2,#2442b8)}
.chkpi .k3{background:linear-gradient(140deg,#7a5cf0,#4b2fb8)}
@media (max-width:370px){.chkpi b{font-size:14px}.chkpi span{font-size:9.5px}}
.chwrap{display:flex;flex-direction:column;gap:10px}
.chsvg{width:100%;height:auto;display:block;overflow:visible}

const LS = "cartao-proto-v1";
const PALETTE = ["#0f9e90","#3b63e6","#d9702a","#b4469b","#2f8f3a","#c2412d","#6b5bd2","#8a7a18"];
const fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money = v => fmt.format(v||0);
const MES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const MESL = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const pad = n => String(n).padStart(2,"0");
const uid = () => Math.random().toString(36).slice(2,10);
const r2 = n => Math.round(n*100)/100;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addYM(ym,k){let [y,m]=ym.split("-").map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`}
function lastDay(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function br(ds){const [y,m,d]=ds.split("-");return `${d}/${m}`}
function brFull(ds){const [y,m,d]=ds.split("-");return `${d}/${m}/${y}`}
function parseMoney(raw){let s=String(raw??"").replace(/[^\d.,]/g,"");if(!s)return NaN;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)}

/* ---------- regras da fatura (por cartão) ---------- */
// Cada fatura é identificada pelo MÊS DE VENCIMENTO (ex.: "2026-11" = fatura de Novembro).
// Assim o "resumão do mês" soma as faturas de todos os cartões que vencem naquele mês.
const CARD_COLORS = ["#0f9e90","#6b5bd2","#c2412d","#2f8f3a","#b4469b","#8a7a18","#3b63e6"];
function cardOf(id){ return S.cards.find(c=>c.id===id) || S.cards[0] }
function closeYMof(cd,D){ return cd.dueDay > cd.closingDay ? D : addYM(D,-1) }
function defClose(cd,D){ const y=closeYMof(cd,D); return `${y}-${pad(Math.min(cd.closingDay,lastDay(y)))}` }
function closeDate(cd,D){ return (cd.overrides||{})[D] || defClose(cd,D) } // último dia que entra na fatura
function cutDate(cd,D){ return addDays(closeDate(cd,D),1) } // primeiro dia que já vai para a fatura seguinte
function dueDate(cd,D){ return `${D}-${pad(Math.min(cd.dueDay,lastDay(D)))}` }
// Compra feita ANTES do fechamento entra naquela fatura; no dia do fechamento ou depois, vai para a seguinte.
function invoiceFor(cd,ds){ const ym=ds.slice(0,7); for(let k=-1;k<4;k++){const D=addYM(ym,k); if(ds<cutDate(cd,D)) return D} return addYM(ym,2) }
function openInvoice(cd){ return invoiceFor(cd,todayStr()) }
function defaultInv(){ const list = V && V.card!=="all" ? [cardOf(V.card)] : S.cards; return list.map(openInvoice).sort()[0] }
function invLabel(D){ const [y,m]=D.split("-"); return `${MESL[+m-1]} ${y}` }
function invShort(D){ const [y,m]=D.split("-"); return `${MES[+m-1]}/${y.slice(2)}` }

function parcelValues(e){ const per=r2(e.total/e.n), out=[]; for(let i=1;i<=e.n;i++) out.push(i===e.n?r2(e.total-per*(e.n-1)):per); return out }
// Gera as parcelas na hora: mudar o fechamento ou editar a compra realoca tudo automaticamente.
function installments(){
  const out=[];
  for(const e of S.expenses){
    const cd=cardOf(e.card), first=invoiceFor(cd,e.date);
    if(e.rec){ const end=e.rec.until && e.rec.until<addYM(openInvoice(cd),3) ? e.rec.until : addYM(openInvoice(cd),3);
      const skip=e.rec.skip||[];
      for(let m=first,k=1; m<=end; m=addYM(m,1),k++) if(!skip.includes(m)) out.push({e, cd, i:k, inv:m, value:e.total, rec:true});
      continue; }
    const vals=parcelValues(e);
    for(let i=1;i<=e.n;i++) out.push({e, cd, i, inv:addYM(first,i-1), value: vals[i-1]});
  }
  return out;
}
// Limite usado = parcelas em faturas ainda não vencidas (as vencidas consideramos pagas).
function limitUsed(cd, all){ const t=todayStr(), o=openInvoice(cd); return r2(all.filter(x=>x.cd.id===cd.id && dueDate(cd,x.inv)>=t && !(x.rec && x.inv>o)).reduce((s,x)=>s+x.value,0)) }

/* ---------- dados ---------- */
function seed(){
  // Ano de exemplo completo: faturas de Jan até a fatura aberta variando de ~21 mil a ~42 mil,
  // com categorias que estouram a meta (Mercado, Restaurantes, Vestuário) e outras que sobram.
  let st=20261013; const rnd=()=>{st|=0;st=st+0x6D2B79F5|0;let t=Math.imul(st^st>>>15,1|st);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];

function migrate(s){

    const n=seed(); if(["me","her","lucca","laura"].includes(s.currentUser)) n.currentUser=s.currentUser; return n;

    const cd={id:uid(),name:"Cartão 1",limit:0,closingDay:s.settings?.closingDay||3,dueDay:s.settings?.dueDay||10,color:CARD_COLORS[0],overrides:{}};
    for(const [k,v] of Object.entries(s.overrides||{})) cd.overrides[cd.dueDay>cd.closingDay?k:addYM(k,1)]=v;
    s.cards=[cd]; delete s.overrides; for(const e of s.expenses||[]) e.card=cd.id; s.lastCard=cd.id;
  }
  if(!s.mainCard || !s.cards.some(c=>c.id===s.mainCard)) s.mainCard = s.cards.some(c=>c.id===s.lastCard) ? s.lastCard : s.cards[0].id;
  s.settings=s.settings||{};
  // Versões anteriores tinham só "Você" e "Esposa": vira uma lista de pessoas, mantendo os nomes.
  if(!s.people){ const n=s.settings.names||{}; s.people=[{id:"me",name:n.me||"Você",color:"var(--me)"},{id:"her",name:n.her||"Esposa",color:"var(--her)"}]; }
  const defaults=s.people.length===2 && s.people[0].name==="Você" && s.people[1].name==="Esposa";
  if(defaults && (s.expenses||[]).some(e=>e.example)){
    s.people[0].name="Kaue"; s.people[1].name="Kaoanna";
    s.people.push({id:"lucca",name:"Lucca",color:"#1f9d63"},{id:"laura",name:"Laura",color:"#c2417f"});
  }
  if(!s.people.some(p=>p.id===s.currentUser)) s.currentUser=s.people[0].id;
  // v5.21: "Fecha dia" passou a ser o último dia que ENTRA na fatura (antes era o primeiro que já ia para a próxima).
  // Converte cada cartão uma vez, sem mudar em que fatura cada gasto cai.
  for(const c of s.cards||[]) if(c.cv!==2){
    c.closingDay = c.closingDay>1 ? c.closingDay-1 : 31;
    const o={}; for(const [k,v] of Object.entries(c.overrides||{})) o[k]=addDays(v,-1); c.overrides=o; c.cv=2; }
  return s;
}

/* ---------- ritmo da fatura aberta (ajuda durante o mês) ---------- */
const dayDiff=(a,b)=>{const [ya,ma,da]=a.split("-").map(Number),[yb,mb,db]=b.split("-").map(Number);return Math.round((new Date(yb,mb-1,db)-new Date(ya,ma-1,da))/864e5)};
// Para cada categoria com meta: quanto já foi gasto na fatura aberta e quanto ainda deve entrar até o fechamento,
// com base no que costuma ser gasto depois deste ponto do ciclo nas últimas faturas fechadas (até 6).
function paceFor(O, all){
  const today=todayStr();
  const cyc=S.cards.map(cd=>{ const st=cutDate(cd,addYM(O,-1)), en=cutDate(cd,O), L=Math.max(1,dayDiff(st,en));
    const open=today<en && today>=st, f=today>=en?1:Math.max(0,Math.min(1,dayDiff(st,today)/L)); return {cd,st,en,L,f,open,left:open?dayDiff(today,en):0}; });
  const openCards=cyc.filter(c=>c.open);
  if(!openCards.length) return null;
  const daysLeft=Math.max(...openCards.map(c=>c.left));
  const closeTxt=openCards.map(c=>c.en).sort().pop();
  const hist=[1,2,3,4,5,6].map(k=>addYM(O,-k)).filter(m=>all.some(x=>x.inv===m));
  const offFrac=(x,cy)=>{ if(x.i>1||x.rec) return 0; const st=cutDate(cy.cd,addYM(x.inv,-1)), en=cutDate(cy.cd,x.inv); return Math.max(0,Math.min(1,dayDiff(st,x.e.date)/Math.max(1,dayDiff(st,en)))) };
  const res=[];
  for(const c of S.categories){ if(!c.goal) continue;
    const spent=sum(all.filter(x=>x.inv===O&&x.e.cat===c.id));
    let rem=0;
    for(const cy of openCards){
      if(hist.length){ const r=hist.map(m=>sum(all.filter(x=>x.inv===m&&x.cd.id===cy.cd.id&&x.e.cat===c.id&&offFrac(x,cy)>cy.f))); rem+=r.reduce((a,b)=>a+b,0)/r.length; }
      else { const s=sum(all.filter(x=>x.inv===O&&x.cd.id===cy.cd.id&&x.e.cat===c.id)); if(cy.f>0.15) rem+=s/cy.f-s; }
    }
    const proj=r2(spent+rem), pct=spent/c.goal;
    const st = spent>c.goal ? "bad" : proj>c.goal*1.03 ? "warn" : proj>c.goal*0.9 ? "tight" : "ok";

  }

  const dl=openCards.filter(c=>V.card==="all"||c.cd.id===V.card).map(c=>({name:c.cd.name,left:c.left})).sort((a,b)=>a.left-b.left);
  return {items:res,daysLeft,closeTxt,usedHist:hist.length,dl};
}

function addDays(ds,k){const [y,m,d]=ds.split("-").map(Number);const x=new Date(y,m-1,d+k);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}

/* ---------- folhas ---------- */
// Trava a página de fundo enquanto uma janela está aberta (iOS rola o fundo sem isso).
let LOCK=null;
function lockScroll(){ if(LOCK!==null) return; document.documentElement.classList.add("locked"); LOCK=window.scrollY; Object.assign(document.body.style,{position:"fixed",top:`-${LOCK}px`,left:"0",right:"0"}) }
function unlockScroll(){ if(LOCK===null) return; document.documentElement.classList.remove("locked"); const y=LOCK; LOCK=null; Object.assign(document.body.style,{position:"",top:"",left:"",right:""}); window.scrollTo(0,y) }
function sheet(html,onMount){
  const L=document.getElementById("layer");
  lockScroll();
  L.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("scrim").onclick=e=>{if(e.target.id==="scrim")closeLayer()};
  L.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeLayer);
  // redesenho da mesma janela (ex.: trocar a categoria na lista): fica no mesmo ponto, sem animar de novo
  if(KEEP){ const n=document.getElementById("sheet"); n.style.animation="none"; n.scrollTop=KEEP.st; }
  onMount&&onMount(L);
  if(KEEP){ const n=document.getElementById("sheet"); n.scrollTop=KEEP.st; }
}
let KEEP=null;
function keepScroll(fn,st){ const sh=document.getElementById("sheet"); KEEP={st: st!=null?st:(sh?sh.scrollTop:0)}; try{ fn() } finally { KEEP=null } }
function closeLayer(){PAD=null;document.getElementById("layer").innerHTML="";unlockScroll(); if(typeof CLOUD!=="undefined" && CLOUD.on) setTimeout(flushRemote,0)}

/* ---------- teclado de valores (estilo maquininha: sempre com centavos, com OK) ---------- */
let PAD=null;
const centsOf = el => parseInt(el.dataset.cents||"0",10);
const moneyVal = el => centsOf(el)/100;
function moneyField(attrs,cents,cls="",ph=""){
  return `<button type="button" class="moneyfield num ${cls}${!cents&&ph?" empty":""}" data-money data-cents="${cents}" ${ph?`data-ph="${esc(ph)}"`:""} ${attrs}>${!cents&&ph?esc(ph):money(cents/100)}</button>`;
}
function setCents(el,c){
  el.dataset.cents=c; const ph=el.dataset.ph;
  el.textContent = !c&&ph ? ph : money(c/100);
  el.classList.toggle("empty",!c&&!!ph);
  if(PAD===el){const v=document.getElementById("padval"); if(v) v.textContent=money(c/100)}
  el.dispatchEvent(new Event("moneychange"));
}
function openPad(el){
  closePad(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  PAD=el; el.classList.add("active");
  const sh=document.getElementById("sheet"); if(sh) sh.classList.add("padopen");
  const p=document.createElement("div"); p.className="pad"; p.id="pad";
  p.innerHTML=`<div class="padread"><span>${esc(el.getAttribute("aria-label")||"Valor")}</span><b id="padval">${money(centsOf(el)/100)}</b></div>` + ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].map(k=>`<button type="button" data-k="${k}" ${k==="OK"?'class="ok"':""} aria-label="${k==="⌫"?"Apagar":k}">${k}</button>`).join("");
  // registra a tecla no instante do toque (sem esperar o "clique"), então digitar rápido funciona
  const press=k=>{ if(!PAD) return; const c=centsOf(PAD);
    if(k==="OK") closePad(); else if(k==="⌫") setCents(PAD,Math.floor(c/10)); else if(c<1e10) setCents(PAD,c*10+ +k) };
  p.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-k]"); if(!b) return; e.preventDefault(); press(b.dataset.k)});
  p.addEventListener("keydown",e=>{const b=e.target.closest("[data-k]"); if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();press(b.dataset.k)}});
  document.getElementById("layer").appendChild(p);
  // rola a janela para o campo ficar visível acima do teclado
  setTimeout(()=>{const sh=document.getElementById("sheet"); if(!sh) return;
    const r=el.getBoundingClientRect(), padTop=p.getBoundingClientRect().top;
    if(r.bottom>padTop-12 || r.top<0) sh.scrollTo({top:sh.scrollTop + r.bottom - (padTop-24), behavior:"smooth"});
  },40);
}
function closePad(){
  if(PAD) PAD.classList.remove("active"); PAD=null;
  const p=document.getElementById("pad"); if(p) p.remove();
  const sh=document.getElementById("sheet"); if(sh) sh.classList.remove("padopen");
}
document.addEventListener("click",e=>{const m=e.target.closest("[data-money]"); if(m) openPad(m)});
document.addEventListener("focusin",e=>{ if(e.target.matches("input,select")) closePad() });
// Enter / "OK" do teclado do iPhone fecha o teclado em campos de texto
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("input")){ e.preventDefault(); e.target.blur() } });
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
const head=t=>`<div class="sh"><h3>${t}</h3><button class="x" data-close aria-label="Fechar">✕</button></div>`;

  L=>{

      if(E) t+=`<br>Ao salvar, todas as parcelas desta compra (já cobradas e futuras) são recalculadas.`;

      if(E){ Object.assign(E,{title,cat,total:tot,n:rec?1:n,date:d,who,card}); if(recV) E.rec=recV; else delete E.rec; save(); closeLayer(); render(); toast("Compra atualizada"); return }
      S.expenses.push({id:uid(),title,cat,total:tot,n:rec?1:n,date:d,who,card,...(recV?{rec:recV}:{})});

    };
    upd();
  });

/* ---------- gráfico anual ---------- */
const MESC=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
let CH=null;
function moneyShort(v){ if(v>=1000){ const k=v/1000; return "R$ "+(k>=10?Math.round(k):k.toFixed(1).replace(".",","))+" mil" } return "R$ "+Math.round(v) }
function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p }
function chartGroups(){
  if(CH.split==="who") return S.people.map(p=>({id:p.id,name:p.name,color:p.color,key:x=>x.e.who}));
  if(CH.split==="card") return S.cards.map(c=>({id:c.id,name:c.name,color:c.color,key:x=>x.cd.id}));
  if(CH.split==="cat") return S.categories.map(c=>({id:c.id,name:c.name,color:c.color,key:x=>x.e.cat}));
  return [{id:"all",name:"Total",color:"var(--brand)",key:()=> "all"}];
}
/* ---------- insights do gráfico ---------- */
// Usa só faturas já abertas/fechadas (até o mês atual) para avaliar comportamento; parcelas futuras entram como "comprometido".
function chartInsights(all, y, nowM){
  const base=all.filter(x=>(CH.card==="all"||x.cd.id===CH.card)&&(CH.who==="all"||x.e.who===CH.who));
  const yr=base.filter(x=>x.inv.startsWith(y+"-"));
  const months=[...new Set(yr.filter(x=>x.inv<nowM).map(x=>x.inv))].sort(); // só faturas fechadas
  const openInYr=String(nowM).startsWith(y+"-");
  const out=[]; const M=m=>MESL[+m.slice(5)-1];
  const cats=CH.cat==="all"?S.categories:S.categories.filter(c=>c.id===CH.cat);
  if(months.length){
    // 1) metas estouradas / folgadas
    const spare=[], blown=[], inGoal=[]; let gap=0;
    for(const c of cats){ if(!c.goal) continue;
      const per=months.map(m=>sum(yr.filter(x=>x.inv===m&&x.e.cat===c.id)));
      const over=per.filter(v=>v>c.goal).length, avg=r2(per.reduce((a,v)=>a+v,0)/per.length);
      if(over && over===months.length && months.length>=2)
        blown.push({c,avg,w:100+avg/c.goal,t:`${c.name} estourou a meta em todos os ${months.length} meses`});
      else if(over && over>=Math.ceil(months.length/2))
        blown.push({c,avg,w:90+over,t:`${c.name} estourou a meta em ${over} de ${months.length} meses`});
      else if(over){
        const lastOver=per[per.length-1]>c.goal;
        out.push({lvl:"warn",w:70+over+(lastOver?5:0),t:lastOver?`${c.name} passou da meta em ${M(months[months.length-1])}`:`${c.name} estourou a meta em ${over} de ${months.length} meses`,
          d:`${lastOver?`${money(per[per.length-1])} nesta fatura contra uma meta de ${money(c.goal)}. `:""}Média de ${money(avg)} (${Math.round(avg/c.goal*100)}% da meta): ${avg<=c.goal?`sobram em média ${money(c.goal-avg)} por mês da meta`:`passa em média ${money(avg-c.goal)} por mês da meta`}. Ainda está sob controle, mas vale acompanhar.`}); }
      else if(months.length>=2 && avg>=c.goal*0.85)
        out.push({lvl:"warn",w:65+avg/c.goal,t:`${c.name} está no limite da meta`,d:`Usa em média ${Math.round(avg/c.goal*100)}% da meta (${money(avg)} de ${money(c.goal)}): sobram só ${money(c.goal-avg)} por mês. Qualquer gasto fora do comum faz estourar.`});
      else if(months.length>=2 && avg<c.goal*0.7)
        spare.push({c,avg,left:r2(c.goal-avg)});
      else if(months.length>=2) inGoal.push({c,avg});
      if(over>=Math.ceil(months.length/2)) gap+=Math.max(0,avg-c.goal);
    }
    // metas estouradas: sempre com as três saídas (aumentar a meta, controlar os gastos ou redistribuir).
    // A redistribuição é um plano único: cada real que sobra é usado uma vez só, então dá para seguir todas as sugestões juntas.
    const spareSorted=spare.map(x=>({...x,orig:x.left,to:[]})).sort((a,b)=>b.left-a.left); let pool=r2(spareSorted.reduce((a,x)=>a+x.left,0));
    const left=v=>v<=0.005?"fica exatamente na meta":`ainda sobram ${money(v)}`;
    const uncovered=[];
    for(const b of blown.sort((a,b)=>b.w-a.w)){
      const need=r2(Math.max(0,b.avg-b.c.goal)), newGoal=Math.ceil(b.avg/50)*50;
      const opts=[`<b>Aumentar a meta</b> para cerca de ${money(newGoal)}, que é o que vocês gastam de fato.`,
                  `<b>Controlar melhor os gastos</b>: cortar uns ${money(need)} por mês em ${esc(b.c.name)} para caber nos ${money(b.c.goal)}.`];
      if(pool>0.005){ const from=[]; let got=0;
        for(const x of spareSorted){ if(got>=need) break; const take=r2(Math.min(x.left,need-got)); if(take<=0) continue; x.left=r2(x.left-take); x.to.push({n:b.c.name,v:take}); from.push({n:esc(x.c.name),v:take,rest:x.left}); got=r2(got+take); }
        pool=r2(pool-got);
        const fromTxt=from.map(f=>`${money(f.v)} de ${f.n} (${f.rest<=0.005?`${f.n} fica exatamente na meta`:`depois disso, ainda sobram ${money(f.rest)} em ${f.n}`})`).join(", ");
        opts.push(`<b>Redistribuir</b>: trazer ${fromTxt}.${got<need?` Isso cobre ${Math.round(got/need*100)}% do que falta; os outros ${money(need-got)} precisam vir da opção 1 ou 2.`:` Isso cobre todo o estouro.`}`);
        if(got<need) uncovered.push({n:b.c.name,v:r2(need-got)});
      } else {
        opts.push(`<b>Redistribuir</b>: não sobra mais folga em outras categorias, porque ela já foi usada nos alertas acima. Aqui só a opção 1 ou a 2.`);
        uncovered.push({n:b.c.name,v:need});
      }
      out.push({lvl:"bad",w:b.w,t:b.t,d:`Média de ${money(b.avg)} por mês para uma meta de ${money(b.c.goal)}. Você pode:`,opts}); }
    if(blown.length>1 && spare.length){ const first=out.find(i=>i.lvl==="bad"&&i.opts); if(first) first.note="As sugestões de redistribuir foram calculadas juntas: cada real que sobra é usado uma vez só. Dá para seguir todas sem estourar a categoria de onde o dinheiro sai. O plano completo está no cartão verde mais abaixo."; }
    // categorias com folga: mostra o plano de redistribuição completo
    if(spare.length){
      const tot=r2(spareSorted.reduce((a,x)=>a+x.orig,0)), moved=r2(spareSorted.reduce((a,x)=>a+(x.orig-x.left),0));
      const lines=spareSorted.map(x=>`<b>${esc(x.c.name)}</b>: sobram ${money(x.orig)} por mês (usa ${Math.round(x.avg/x.c.goal*100)}% da meta)`+
        (x.to.length?`. Vão ${x.to.map(t=>`${money(t.v)} para ${esc(t.n)}`).join(", ")}; depois disso, ${x.left<=0.005?"fica exatamente na meta":`ainda sobram ${money(x.left)}`}.`:`. Não precisa ser usada; ${left(x.left)}.`));
      const t = spare.length===1 ? `${spare[0].c.name} sobrou em todos os meses` : `${spare.length} categorias sobraram em todos os meses`;
      let d = `Juntas, deixam ${money(tot)} de folga por mês.`;
      if(moved>0) d+= tot-moved>0.005 ? ` O plano de redistribuir usa ${money(moved)} e ainda sobram ${money(tot-moved)} para guardar.` : ` O plano de redistribuir usa toda essa folga:`;
      else d+=` Dá para baixar essas metas ou guardar a diferença.`;
      const note = uncovered.length ? `Mesmo usando toda a folga, ainda faltam ${uncovered.map(u=>`${money(u.v)} em ${u.n}`).join(", ")} por mês. Para esses, só aumentando a meta ou cortando gastos.` : "";
      out.push({lvl:"good",w:50,t,d,opts:lines,plain:true,note}); }
    if(inGoal.length){ const tot=r2(inGoal.reduce((a,x)=>a+x.c.goal-x.avg,0));
      const names=inGoal.map(x=>`${x.c.name}: sobram ${money(x.c.goal-x.avg)} por mês (usa ${Math.round(x.avg/x.c.goal*100)}% da meta)`).join("; ");
      out.push({lvl:"good",w:45,t:inGoal.length===1?`${inGoal[0].c.name} ficou dentro da meta em todos os meses`:`${inGoal.length} categorias dentro da meta em todos os meses`,d:`${names}.${inGoal.length>1?` Juntas, sobram ${money(tot)} por mês.`:""} Estão equilibradas, sem estourar e sem sobrar demais.`}); }
    // 2) mês atual x média dos anteriores
    if(months.length>=2){
      const last=months[months.length-1], prev=months.slice(0,-1);
      const scoped=x=>CH.cat==="all"||x.e.cat===CH.cat;
      const lv=sum(yr.filter(x=>x.inv===last&&scoped(x))), pv=r2(prev.reduce((a,m)=>a+sum(yr.filter(x=>x.inv===m&&scoped(x))),0)/prev.length);
      if(pv>0){ const d=Math.round((lv-pv)/pv*100);
        if(d>=15) out.push({lvl:"warn",w:80+d/10,t:`${M(last)} está ${d}% acima da média`,d:`${money(lv)} nesta fatura contra uma média de ${money(pv)} nos meses anteriores.`});
        else if(d<=-15) out.push({lvl:"good",w:40,t:`${M(last)} está ${Math.abs(d)}% abaixo da média`,d:`${money(lv)} nesta fatura contra uma média de ${money(pv)}. Bom sinal!`});
      }
    }
  }
  // fatura aberta: ainda está sendo preenchida, então só entra como alerta se já passou da meta
  if(openInYr){ for(const c of cats){ if(!c.goal) continue; const v=sum(yr.filter(x=>x.inv===nowM&&x.e.cat===c.id));
      if(v>c.goal) out.push({lvl:"bad",w:120+v/c.goal,t:`${c.name} já estourou a meta na fatura aberta (${M(nowM)})`,d:`Já são ${money(v)} para uma meta de ${money(c.goal)}, e a fatura ainda nem fechou. O ideal é parar de gastar nessa categoria até o fechamento.`}); } }
  // 3) limite dos cartões
  for(const c of S.cards){ if(!c.limit || (CH.card!=="all"&&CH.card!==c.id)) continue;
    const used=limitUsed(c,all), pct=Math.round(used/c.limit*100);
    if(pct>=80) out.push({lvl:pct>=95?"bad":"warn",w:85+pct/10,t:`${c.name} com ${pct}% do limite usado`,d:`Disponível: ${money(c.limit-used)} de ${money(c.limit)}. Novas compras parceladas vão apertar ainda mais.`}); }
  // 4) parcelas já comprometidas
  const recs=[...new Map(base.filter(x=>x.rec&&x.inv===nowM&&(CH.cat==="all"||x.e.cat===CH.cat)).map(x=>[x.e.id,x.e])).values()];
  if(recs.length) out.push({lvl:"info",w:55,t:`${money(sum(recs.map(e=>({value:e.total}))))} por mês em contas recorrentes`,d:recs.map(e=>`${e.title} ${money(e.total)}`).join(" · ")+". Já entram sozinhas em todas as faturas."});
  const fut=base.filter(x=>x.inv>nowM&&!x.rec&&(CH.cat==="all"||x.e.cat===CH.cat));
  if(fut.length){ const tot=sum(fut), lastM=fut.map(x=>x.inv).sort().pop(), nxt=sum(fut.filter(x=>x.inv===addYM(nowM,1)));
    out.push({lvl:"info",w:60,t:`${money(tot)} já comprometidos em parcelas`,d:`A próxima fatura já começa com ${money(nxt)}. As parcelas vão até ${M(lastM)}${lastM.slice(0,4)!==String(y)?" de "+lastM.slice(0,4):""}.`}); }
  // 5) onde mais vai o dinheiro
  if(CH.cat==="all" && months.length){ const tot=sum(yr.filter(x=>x.inv<=nowM));
    const top=S.categories.map(c=>({c,v:sum(yr.filter(x=>x.inv<=nowM&&x.e.cat===c.id))})).sort((a,b)=>b.v-a.v)[0];
    if(top&&tot) out.push({lvl:"info",w:20,t:`${top.c.name} é onde mais vai o dinheiro`,d:`${Math.round(top.v/tot*100)}% de tudo o que foi gasto no ano até agora (${money(top.v)}).`}); }
  // 6) quem mais gastou no ano
  if(CH.who==="all" && S.people.length>1 && months.length){ const sc=x=>x.inv<=nowM&&(CH.cat==="all"||x.e.cat===CH.cat); const tot=sum(yr.filter(sc));
    const pp=S.people.map(p=>({p,v:sum(yr.filter(x=>sc(x)&&x.e.who===p.id))})).sort((a,b)=>b.v-a.v);
    if(tot) out.push({lvl:"info",w:15,t:`${pp[0].p.name} responde por ${Math.round(pp[0].v/tot*100)}% dos gastos`,d:pp.map(q=>`${q.p.name} ${money(q.v)} (${Math.round(q.v/tot*100)}%)`).join(" · ")+"."}); }
  // 7) maior compra do ano
  { const es=[...new Map(yr.filter(x=>CH.cat==="all"||x.e.cat===CH.cat).map(x=>[x.e.id,x.e])).values()].sort((a,b)=>b.total-a.total)[0];
    if(es && es.total>0) out.push({lvl:"info",w:10,t:`Maior compra: ${es.title}`,d:`${money(es.total)}${es.n>1?` em ${es.n}x de ${money(r2(es.total/es.n))}`:""}, em ${brFull(es.date)}, por ${nameOf(es.who)} no ${cardOf(es.card).name}.`}); }
  // todos os de atenção; dos outros níveis, os mais relevantes (até 3 de cada), sempre na ordem atenção → de olho → info → bom
  const order={bad:0,warn:1,info:2,good:3}, res=[];
  for(const lvl of ["bad","warn","info","good"]){ const l=out.filter(i=>i.lvl===lvl).sort((a,b)=>b.w-a.w); res.push(...(lvl==="bad"?l:l.slice(0,3))); }
  return res;
}
function insightsHtml(list){
  if(!list.length) return "";
  const ic={bad:"!",warn:"▲",good:"✓",info:"i"}, lb={bad:"Atenção",warn:"De olho",good:"Bom",info:"Info"};
  const cnt=k=>list.filter(i=>i.lvl===k).length;
  const chips=["bad","warn","info","good"].filter(k=>cnt(k)).map(k=>`<span class="inc ${k}">${cnt(k)} ${lb[k].toLowerCase()}</span>`).join("");
  return `<div class="ins"><div class="insh"><b>O que os números dizem</b><span class="small">médias com as faturas fechadas</span></div><div class="incs">${chips}</div>
    ${list.map(i=>`<div class="insi ${i.lvl}"><span class="insb" aria-label="${lb[i.lvl]}">${ic[i.lvl]}</span><div><b>${esc(i.t)}</b><span>${esc(i.d)}</span>${i.opts?`<ol class="insopt${i.plain?" plain":""}">${i.opts.map(o=>`<li><div>${o}</div></li>`).join("")}</ol>`:""}${i.note?`<span class="insnote">${esc(i.note)}</span>`:""}</div></div>`).join("")}</div>`;
}

function isDefaultCH(){ return CH.card==="all"&&CH.cat==="all"&&CH.who==="all"&&CH.split==="cat" }

function renderChart(){
  const box=document.getElementById("chBody"); if(!box) return;
  const all=installments(), y=CH.year, months=[...Array(12)].map((_,i)=>`${y}-${pad(i+1)}`);
  const rows=all.filter(x=>x.inv.startsWith(y+"-")&&(CH.card==="all"||x.cd.id===CH.card)&&(CH.cat==="all"||x.e.cat===CH.cat)&&(CH.who==="all"||x.e.who===CH.who));
  const groups=chartGroups();
  const data=months.map(m=>{const r=rows.filter(x=>x.inv===m); return {m, total:sum(r), parts:groups.map(g=>({g, v:sum(r.filter(x=>g.key(x)===g.id))}))}});
  const yearTotal=r2(data.reduce((a,d)=>a+d.total,0));
  const nowM=defaultInv();
  const used=data.filter(d=>d.total>0), past=data.filter(d=>d.m<nowM && d.total>0);
  const avg=past.length? r2(past.reduce((a,d)=>a+d.total,0)/past.length):0;
  const top=used.length? used.reduce((a,d)=>d.total>a.total?d:a):null;
  const cat=CH.cat!=="all"?catOf(CH.cat):null, goal=cat&&cat.goal?cat.goal:0;
  // teto = milhar mais próximo acima do maior gasto (ou da meta)
  const peak=Math.max(goal,...data.map(d=>d.total));
  const max=Math.max(1000,Math.ceil(peak/1000)*1000);
  const step=[1000,2000,5000,10000,20000,50000].find(st=>max/st<=5)||100000;
  const ticks=[]; for(let t=0;t<max-0.1;t+=step) ticks.push(t);
  if(ticks.length>1 && max-ticks[ticks.length-1]<step*0.35) ticks.pop(); ticks.push(max);
  // no computador o gráfico ocupa a largura toda: viewBox mais largo, barras mais largas
  const wide=box.clientWidth>=760, VW=wide?1000:340;
  const L=40,R=VW-4,T=24,B=196, bw=(R-L)/12, w=wide?Math.min(46,bw*.5):Math.min(19,bw*.7), rTop=Math.min(wide?9:6,w/2.6);
  const yv=v=>B-(v/max)*(B-T);
  const tick=v=>v===0?"0":(v/1000)+" mil";
  // barra com topo arredondado e base reta (ancorada no eixo)
  const barPath=(x,yTop,ww,hh,r)=>{ r=Math.min(r,hh,ww/2); return `M${x} ${yTop+hh}V${yTop+r}Q${x} ${yTop} ${x+r} ${yTop}H${x+ww-r}Q${x+ww} ${yTop} ${x+ww} ${yTop+r}V${yTop+hh}Z` };
  let svg=`<svg viewBox="0 0 ${VW} 222" class="chsvg${wide?" wide":""}" role="img" aria-label="Gastos por mês em ${y}">
    <defs>
      <linearGradient id="chG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a63f0"/><stop offset="1" stop-color="#12b5a2"/></linearGradient>
      <linearGradient id="chSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".10"/></linearGradient>
      <pattern id="chH" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.2" height="5" fill="#fff" fill-opacity=".55"/></pattern>
    </defs>`;
  for(const t of ticks){ svg+=`<line x1="${L}" x2="${R}" y1="${yv(t)}" y2="${yv(t)}" class="${t?"grid":"base"}"/><text x="${L-6}" y="${yv(t)+3.5}" class="ax" text-anchor="end">${tick(t)}</text>` }
  data.forEach((d,i)=>{
    const cx=L+i*bw+bw/2, x=cx-w/2, fut=d.m>nowM, isSel=CH.sel===d.m, dim=CH.sel&&!isSel;
    // trilho de fundo até o teto, dá estrutura a cada mês
    svg+=`<path d="${barPath(x,T,w,B-T,rTop)}" class="track${isSel?" tracksel":""}"/>`;
    if(d.total>0){
      const top=yv(d.total), h=B-top;
      svg+=`<clipPath id="cb${i}"><path d="${barPath(x,top,w,h,rTop)}"/></clipPath><g clip-path="url(#cb${i})" style="opacity:${dim?.3:1}">`;
      if(CH.split==="none"){
        svg+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#chG)"/>`;
      } else {
        let acc=0;
        for(const p of d.parts){ if(!p.v) continue; const y0=yv(acc+p.v), hh=yv(acc)-y0;
          svg+=`<rect x="${x}" y="${y0}" width="${w}" height="${hh}" style="fill:${p.g.color}"/>`;
          if(acc>0) svg+=`<rect x="${x}" y="${yv(acc)-1}" width="${w}" height="2" class="gap"/>`;
          acc+=p.v }
      }
      svg+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#chSheen)"/>`;
      if(fut) svg+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="url(#chH)"/>`;
      svg+=`</g>`;
      if(!dim){ const lab=d.total>=1000?(d.total/1000).toFixed(1).replace(".",",")+"k":String(Math.round(d.total)); const lw=lab.length*4.9+8;
        svg+=`<rect x="${cx-lw/2}" y="${top-17}" width="${lw}" height="13" rx="6.5" class="${isSel?"vlpsel":"vlp"}"/><text x="${cx}" y="${top-7.6}" class="${isSel?"vlsel":"vl"}" text-anchor="middle">${lab}</text>`; }
    }
    svg+=`<text x="${cx}" y="${B+16}" class="ax${isSel?" axsel":""}" text-anchor="middle">${MESC[i]}</text>`;
    svg+=`<rect x="${L+i*bw}" y="${T-18}" width="${bw}" height="${B-T+38}" class="hit" data-m="${d.m}"><title>${MESL[i]}: ${money(d.total)}</title></rect>`;
  });
  if(avg>0 && !goal){ svg+=`<line x1="${L}" x2="${R}" y1="${yv(avg)}" y2="${yv(avg)}" class="avgline"/>` }
  if(goal){ svg+=`<line x1="${L}" x2="${R}" y1="${yv(goal)}" y2="${yv(goal)}" class="goalline"/><text x="${R}" y="${yv(goal)-4}" class="ax goaltx" text-anchor="end">Meta ${money(goal)}</text>` }
  svg+=`</svg>`;
  // resumo embaixo: ano inteiro por padrão; ao tocar num mês, só aquele mês
  const sd=data.find(d=>d.m===CH.sel);
  const scopeRows = sd ? rows.filter(x=>x.inv===sd.m) : rows;
  const scopeTotal = sd ? sd.total : yearTotal;
  const dimGroups = CH.split==="none" ? S.categories.map(c=>({id:c.id,name:c.name,color:c.color,key:x=>x.e.cat})) : groups;
  const bd=dimGroups.map(g=>({name:g.name,color:g.color,v:sum(scopeRows.filter(x=>g.key(x)===g.id))})).filter(q=>q.v>0).sort((a,b)=>b.v-a.v);
  const mi = sd ? +sd.m.slice(5)-1 : 0;
  const by = {none:"categoria",who:"pessoa",card:"cartão",cat:"categoria"}[CH.split];
  const detail=`<div class="chdet"><div class="chdh"><span><b>${sd?`${MESL[mi]} ${y}`:`Ano de ${y}`}</b><small>${sd?"Toque no mês de novo para ver o ano":"Por "+by+" · toque num mês para ver só ele"}</small></span><b class="num">${money(scopeTotal)}</b></div>
      ${sd&&sd.m>nowM?`<div class="small">Fatura futura: parcelas já comprometidas até agora.</div>`:""}
      ${goal&&sd?`<div class="small num">Meta ${money(goal)} · ${Math.round(sd.total/goal*100)}% usado</div>`:""}
      ${bd.length?`<div class="chlist">${bd.map(q=>`<div class="chli num"><span class="chn"><span class="dot" style="background:${q.color}"></span>${esc(q.name)}</span><span class="chbar"><i style="width:${scopeTotal?q.v/scopeTotal*100:0}%;background:${q.color}"></i></span><span class="chv">${money(q.v)} <small>${scopeTotal?Math.round(q.v/scopeTotal*100):0}%</small></span></div>`).join("")}</div>`:`<div class="small">Nenhum gasto com esses filtros.</div>`}</div>`;
  const legend = CH.split!=="none" ? `<div class="pvs" style="margin:0">${groups.filter(g=>data.some(d=>d.parts.find(p=>p.g.id===g.id).v>0)).map(g=>`<span><span class="dot" style="background:${g.color}"></span>${esc(g.name)}</span>`).join("")}</div>` : "";
  box.innerHTML=`
    <div class="invnav"><button class="iconbtn" id="chPrev" aria-label="Ano anterior">${ICON.left}</button><div class="lbl"><b>${y}</b><span>Faturas pelo mês de vencimento</span></div><button class="iconbtn" id="chNext" aria-label="Próximo ano">${ICON.right}</button></div>
    <div class="chkpi num">
      <div class="k1"><span>Total no ano</span><b>${kMoney(yearTotal)}</b><small>${y}</small></div>
      <div class="k2"><span>Média/mês</span><b>${kMoney(avg)}</b><small>${past.length} ${past.length===1?"fechado":"fechados"}</small></div>
      <div class="k3"><span>Maior mês</span><b>${top?MESL[+top.m.slice(5)-1]:"—"}</b>${top?`<small>${money(top.total)}</small>`:""}</div>
    </div>
    <div class="chwrap">
      <div class="chsel">
        ${pickSel("split","Separar",[{id:"none",name:"Nada"},{id:"cat",name:"Categoria"},{id:"who",name:"Pessoa"},{id:"card",name:"Cartão"}])}
        ${pickSel("card","Cartão",[{id:"all",name:"Todos"},...S.cards.map(c=>({id:c.id,name:c.name}))])}
        ${pickSel("cat","Categoria",[{id:"all",name:"Todas"},...S.categories.map(c=>({id:c.id,name:c.name}))])}
        ${pickSel("who","Pessoa",[{id:"all",name:"Todos"},...S.people.map(p=>({id:p.id,name:p.name}))])}
        ${isDefaultCH()?"":`<button class="chclear" id="chReset">Limpar</button>`}
      </div>
      ${svg}${legend}
      <div class="chnote"><span class="sw"></span>Faturas futuras: parcelas já lançadas${avg>0&&!goal?`</div><div class="chnote"><span class="avgk"></span>Média mensal: ${money(avg)}`:""}</div>
    </div>
    <div class="chgrid"><div>${detail}</div><div>${insightsHtml(chartInsights(all, y, nowM))}</div></div>`;
  box.querySelector("#chPrev").onclick=()=>{CH.year--;CH.sel=null;renderChart()};
  box.querySelector("#chNext").onclick=()=>{CH.year++;CH.sel=null;renderChart()};
  const rb=box.querySelector("#chReset"); if(rb) rb.onclick=()=>{const o=defaultInv();CH={year:+o.slice(0,4),card:"all",cat:"all",who:"all",split:"cat",sel:null};renderChart()};
  box.querySelectorAll("select[data-chs]").forEach(sl=>sl.onchange=()=>{CH[sl.dataset.chs]=sl.value;renderChart()});
  box.querySelectorAll(".hit").forEach(h=>h.onclick=()=>{CH.sel=CH.sel===h.dataset.m?null:h.dataset.m;renderChart()});
  box.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{CH[b.dataset.ch]=b.dataset.v;renderChart()});
}

// Cada compra vira um lançamento: parcelas "3/10" viram compra de 10x já na fatura certa,
// e o que o app não sabe classificar ele pergunta uma por uma (e aprende para a próxima vez).
const normTxt=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const PARC_RE=/(?:\s*[-–]?\s*\(?parc(?:ela)?s?\.?\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\)?)|(?:\s*(\d{2})\/(\d{2})\s*$)|(?:\s(\d)\/(\d{1,2})\s*$)|(?:\s*\(\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\))/i;
const ACQ_RE=/^(ifd|mp|pag|pg|ec|ebn|pp|sumup|smp|ebanx|paypal|htm|dl|apl|mercpago|pagseguro|stone|cielo)\s?\*\s?/i;
function merchantKey(desc){
  return normTxt(desc).replace(PARC_RE,"").replace(ACQ_RE,"").replace(/\s*-ct\b/g," ").replace(/[*_\-.,/\\]+/g," ").replace(/\b\d+\b/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");
}
function niceTitle(desc){
  const t=String(desc).replace(PARC_RE,"").replace(ACQ_RE,"").replace(/\s*-CT\b/gi," ").replace(/\s+/g," ").trim();
  return t.toLowerCase().replace(/(^|[\s*])[^\s*]/g,m=>m.toUpperCase()).replace(/\bIof\b/g,"IOF").replace(/ (De|Da|Do|Das|Dos|E) /g,m=>m.toLowerCase()).slice(0,40)||"Compra";
}

  for(let p=1;p<=doc.numPages;p++){ const pg=await doc.getPage(p), tc=await pg.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],s:i.str,w:i.width||0}));
    // faturas em duas colunas: acha onde começa a coluna da direita pelas datas
    const dx=items.filter(i=>/^\d{2}\/\d{2}(\s|$)/.test(i.s.trim())).map(i=>i.x).sort((a,b)=>a-b);
    let split=lastSplit; if(dx.length>=4){ const R=dx.filter(x=>x>dx[0]+120); if(R.length>=3) split=lastSplit=R[0]-4; }
    for(const col of [items.filter(i=>i.x<split), items.filter(i=>i.x>=split)]){
      const rows=[]; for(const it of col.sort((a,b)=>b.y-a.y)){ const r=rows.find(r=>Math.abs(r.y-it.y)<2.5); if(r) r.it.push(it); else rows.push({y:it.y,it:[it]}); }
      // junta os pedaços da linha: o PDF às vezes quebra palavras com acento ("Lan" "ç" "amentos")
      rows.sort((a,b)=>b.y-a.y); for(const r of rows){ let t="", end=null; for(const i of r.it.sort((a,b)=>a.x-b.x)){ t += (end!==null && i.x-end>1.2 ? " " : "") + i.s; end=i.x+i.w; } lines.push(t.replace(/\s+/g," ").trim()); } }
  }
  return lines;
}

function reconcile(){
  const cd=cardOf(IMP.card), D=IMP.D;

  IMP.app=app.map(x=>({x,used:false,act:"keep"})); IMP.recon=app.length>0;
  if(!IMP.recon) return;
  const bank=IMP.items.filter(i=>!i.credit&&!i.skipH);
  bank.forEach(i=>{ i.dup=false; i.status="miss"; i.use=true; i.match=null; });
  const sim=(i,x)=>{ const a=new Set(i.key.split(" ").filter(w=>w.length>2)); return normTxt(x.e.title).replace(/[^a-z0-9 ]/g," ").split(/\s+/).some(w=>w.length>2&&a.has(w)) };

    if(i.rec){ if(seenRec.has(i.key)) { /* mesma conta duas vezes no mês: entra avulsa */ } else { seenRec.add(i.key); recs++;

    S.expenses.push({id:uid(),title:i.title,cat:i.cat,total:i.total,n:i.n,date:i.date,who:i.who||IMP.who,card:cd.id,imported:true}); n++; }
  let fixed=0, moved=0, dels=0;
  if(IMP.recon){
    for(const i of IMP.items) if(i.status==="diff" && i.fix){ const e=i.match.x.e; e.total = e.n>1 ? r2(i.value*e.n) : i.value; fixed++; }
    for(const a of IMP.app){ const e=a.x.e; if(a.used||a.act==="keep") continue;
      if(e.rec){ e.rec.skip=[...new Set([...(e.rec.skip||[]),IMP.D])]; a.act==="del"?dels++:moved++; continue; }
      if(a.act==="del"){ S.expenses=S.expenses.filter(x=>x.id!==e.id); dels++; }
      else { e.date=cutDate(cd,IMP.D); moved++; } }
    S.recon=S.recon||{}; S.recon[cd.id+"|"+IMP.D]=todayStr();
  }
  let closeMsg="";
  if(IMP.meta && IMP.meta.nextClose){ const nx=addYM(IMP.D,1); if(IMP.meta.nextClose!==closeDate(cd,nx)){ cd.overrides=cd.overrides||{}; cd.overrides[nx]=IMP.meta.nextClose; closeMsg=` · fechamento de ${invShort(nx)} ajustado para ${br(IMP.meta.nextClose)}`; } }
  save(); closeLayer(); V.inv=IMP.D; V.card=IMP.recon?cd.id:"all"; render();
  if(closeMsg) setTimeout(()=>toast("Pelo PDF"+closeMsg),2600);
  if(IMP.recon) toast(`Fatura conferida ✓${n?` · ${n} lançados`:""}${fixed?` · ${fixed} corrigidos`:""}${moved?` · ${moved} movidos`:""}${dels?` · ${dels} apagados`:""}`);
  else toast(`${n} lançamentos importados${recs?` · ${recs} ${recs===1?"recorrente":"recorrentes"}`:""}`);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer()});
/* ---------- nuvem (Supabase): login, família e sincronização entre os celulares ----------
   Sem configuração (CLOUD_CFG vazio) o app funciona como antes, só neste aparelho.
   Com configuração: cada pessoa entra com e-mail e senha, a família compartilha os mesmos dados
   e o que um lança aparece no celular do outro. O mesmo banco servirá o app nativo (Expo) depois. */
const CLOUD_CFG = window.GASTO_CLOUD || {url:"", key:""};
const CLOUD = {on:false, sb:null, user:null, fam:null, last:{}, pending:[], pushing:false, dirty:false, timer:null, chan:null, status:"", retry:null};
const ORDERED = {person:"people", card:"cards", category:"categories"};
const KINDS = [["person","people"],["card","cards"],["category","categories"],["expense","expenses"]];
const LOCAL_ONLY = ["people","cards","categories","expenses","rules","currentUser"];
function stableStr(v){ if(v===null||typeof v!=="object") return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v)) return "["+v.map(stableStr).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stableStr(v[k])).join(",")+"}"; }
// estado do app → itens do banco (uma linha por pessoa, cartão, categoria, gasto e regra aprendida, + uma linha "meta")
function toItems(s){ const m={};
  for(const [k,arr] of KINDS) (s[arr]||[]).forEach((x,o)=>{ m[k+"|"+x.id]=stableStr(ORDERED[k]?{...x,_o:o}:x); });
  (s.rules||[]).forEach(r=>{ m["rule|"+r.k]=stableStr(r); });
  const meta={}; for(const [k,v] of Object.entries(s)) if(!LOCAL_ONLY.includes(k)) meta[k]=v; m["meta|main"]=stableStr(meta);
  return m; }
function fromItems(map,currentUser){ const s={people:[],cards:[],categories:[],expenses:[],rules:[]};
  for(const [key,str] of Object.entries(map)){ const k=key.slice(0,key.indexOf("|")), d=JSON.parse(str);
    if(k==="meta"){ Object.assign(s,d); continue; }
    const arr = k==="rule" ? "rules" : (KINDS.find(x=>x[0]===k)||[])[1]; if(arr) s[arr].push(d); }
  for(const arr of ["people","cards","categories"]){ s[arr].sort((a,b)=>(a._o||0)-(b._o||0)); s[arr].forEach(x=>delete x._o); }
  s.currentUser=currentUser; return s; }
const cacheKey = () => `${LS}:fam:${CLOUD.fam.id}`;
function persistCache(){ try{ localStorage.setItem(cacheKey(), JSON.stringify({S, last:CLOUD.last})) }catch{} }
function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(cacheKey())||"null"); if(c&&c.S){ S=migrate(c.S); CLOUD.last=c.last||{}; return true; } }catch{} return false; }
function localDirty(){ const cur=toItems(S); for(const k in cur) if(CLOUD.last[k]!==cur[k]) return true; for(const k in CLOUD.last) if(!(k in cur)) return true; return false; }
function setSync(st){ CLOUD.status=st; const el=document.getElementById("syncdot"); if(el){ el.dataset.st=st; el.title=SYNC_TXT[st]||""; } }
const SYNC_TXT={ok:"Sincronizado",salvando:"Salvando…",offline:"Sem internet: salvo no celular, envia quando voltar"};
function schedulePush(){ if(!CLOUD.on) return; clearTimeout(CLOUD.timer); setSync("salvando"); CLOUD.timer=setTimeout(cloudPush,500); }
async function cloudPush(){
  if(!CLOUD.on) return; if(CLOUD.pushing){ CLOUD.dirty=true; return; }
  CLOUD.pushing=true; CLOUD.dirty=false; let failed=false;
  try{
    const cur=toItems(S), ups=[];
    for(const [k,v] of Object.entries(cur)) if(CLOUD.last[k]!==v) ups.push({k,v,deleted:false});
    for(const k of Object.keys(CLOUD.last)) if(!(k in cur)) ups.push({k,v:CLOUD.last[k],deleted:true});
    const rows=ups.map(u=>{ const i=u.k.indexOf("|"); return {family_id:CLOUD.fam.id, kind:u.k.slice(0,i), id:u.k.slice(i+1), data:JSON.parse(u.v), deleted:u.deleted}; });
    for(let i=0;i<rows.length;i+=400){ const {error}=await CLOUD.sb.from("items").upsert(rows.slice(i,i+400),{onConflict:"family_id,kind,id"}); if(error) throw error; }
    for(const u of ups){ if(u.deleted) delete CLOUD.last[u.k]; else CLOUD.last[u.k]=u.v; }
    persistCache(); setSync("ok");
  }catch(e){ failed=true; setSync("offline"); clearTimeout(CLOUD.retry); CLOUD.retry=setTimeout(cloudPush,10000); }
  finally{ CLOUD.pushing=false; if(CLOUD.dirty && !failed) schedulePush(); else flushRemote(); }
}
// mudanças que chegam do outro celular
function onRemote(r){ if(!r||!r.kind) return; const key=r.kind+"|"+r.id, str=r.deleted?null:stableStr(r.data);
  if((CLOUD.last[key]??null)===str) return; CLOUD.pending.push([key,str]); flushRemote(); }
function flushRemote(){
  if(!CLOUD.pending.length || CLOUD.pushing) return;
  if(document.getElementById("layer").innerHTML) return; // espera fechar a janela aberta
  if(localDirty()){ cloudPush(); return; }               // primeiro manda o que é deste celular
  for(const [k,v] of CLOUD.pending){ if(v===null) delete CLOUD.last[k]; else CLOUD.last[k]=v; }
  CLOUD.pending=[]; S=migrate(fromItems(CLOUD.last,S.currentUser)); persistCache(); render();
}
async function pullAll(){
  const map={}; let from=0;
  for(;;){ const {data,error}=await CLOUD.sb.from("items").select("kind,id,data,deleted").eq("family_id",CLOUD.fam.id).range(from,from+999);
    if(error) throw error; for(const r of data) if(!r.deleted) map[r.kind+"|"+r.id]=stableStr(r.data);
    if(data.length<1000) break; from+=1000; }
  return map;
}
function subscribe(){
  if(CLOUD.chan) CLOUD.sb.removeChannel(CLOUD.chan);
  CLOUD.chan=CLOUD.sb.channel("fam-"+CLOUD.fam.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"items",filter:`family_id=eq.${CLOUD.fam.id}`},p=>onRemote(p.new))
    .subscribe(st=>{ if(st==="SUBSCRIBED") setSync(localDirty()?"salvando":"ok"); });
}

async function afterLogin(){
  gate(`<div class="card gcard"><p class="small" style="margin:0;text-align:center">Carregando…</p></div>`);
  const {data,error}=await CLOUD.sb.from("members").select("family_id,person_id,families(name,code)").eq("user_id",CLOUD.user.id).limit(1);
  if(error){ // sem internet: abre com o que está guardado no celular
    try{ const c=JSON.parse(localStorage.getItem(LS+":lastfam")||"null"); if(c){ CLOUD.fam=c; if(loadCache()){ CLOUD.on=true; S.currentUser=c.person; setSync("offline"); enterApp(); return; } } }catch{}
    return gate(`<div class="card gcard"><h2>Sem conexão</h2><p class="small">Não consegui falar com o servidor. Confira a internet.</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div>`); }
  if(!data.length) return familyView();
  const m=data[0]; CLOUD.fam={id:m.family_id, code:m.families&&m.families.code, name:m.families&&m.families.name, person:m.person_id};
  afterFamily();
}
async function afterFamily(){
  try{ localStorage.setItem(LS+":lastfam",JSON.stringify(CLOUD.fam)) }catch{}
  const had=loadCache(); CLOUD.on=true;
  try{
    if(had && localDirty()) await cloudPush();     // o que foi lançado sem internet vai primeiro
    const map=await pullAll();
    if(!Object.keys(map).length && !had){ S=emptyState(); CLOUD.last={}; }
    else { CLOUD.last=map; S=migrate(fromItems(map, CLOUD.fam.person)); }
  }catch(e){ if(!had){ CLOUD.on=false; return gate(`<div class="card gcard"><h2>Erro ao carregar</h2><p class="small">${esc(e.message||String(e))}</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div>`); } setSync("offline"); }
  startCloud(false);
}
function startCloud(isNew){
  CLOUD.on=true; subscribe(); persistCache();
  try{ localStorage.setItem(LS+":lastfam",JSON.stringify(CLOUD.fam)) }catch{}
  if(isNew||localDirty()) cloudPush();
  if(!CLOUD.fam.person || !S.people.some(p=>p.id===CLOUD.fam.person)) return whoView();
  S.currentUser=CLOUD.fam.person; enterApp();
}
async function cloudLogout(){ try{ if(CLOUD.on && localDirty()) await cloudPush(); }catch{} CLOUD.on=false; if(CLOUD.chan) CLOUD.sb.removeChannel(CLOUD.chan);
  try{ localStorage.removeItem(LS+":lastfam") }catch{} await CLOUD.sb.auth.signOut(); location.reload(); }
async function cloudSetMe(pid){ CLOUD.fam.person=pid; try{ localStorage.setItem(LS+":lastfam",JSON.stringify(CLOUD.fam)) }catch{}
  const {error}=await CLOUD.sb.from("members").update({person_id:pid}).eq("family_id",CLOUD.fam.id).eq("user_id",CLOUD.user.id); if(error) toast("Não consegui salvar quem é você: "+error.message); }
window.addEventListener("online",()=>{ if(CLOUD.on) cloudPush(); });
document.addEventListener("visibilitychange",()=>{ if(CLOUD.on && document.visibilityState==="visible"){ cloudPush(); } });

    $("b_cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(data); toast("Backup copiado. Cole no app novo em Configurações → Backup."); }catch{ $("b_txt").value=data; $("b_txt").select(); toast("Selecionei o texto: toque em Copiar"); } };
    $("b_file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("b_txt").value=String(r.result); toast("Arquivo carregado"); }; r.readAsText(f); };

      const ns=o&&o.S; if(!ns||!Array.isArray(ns.expenses)||!Array.isArray(ns.categories)) return toast("Esse texto não é um backup do Gastô");
      confirmSheet("Restaurar o backup?",`Substitui tudo o que está aqui por ${ns.expenses.length} gastos, ${ns.categories.length} categorias e ${(ns.rules||[]).length} lojas aprendidas${CLOUD.on?", para todos do ambiente":""}.`,"Restaurar",()=>{

        save(); V={card:"all",inv:null,who:"all",cat:null}; V.inv=defaultInv(); render(); toast("Backup restaurado"); }); };
  });

/* importar em lote: arquivo de vários meses já classificado (preparado pelo Claude). Junta com o que já existe, não substitui. */
function lotePrep(o,cardId,off){ off=off||new Set();
  const cd=cardOf(cardId), E=S.expenses.filter(e=>e.card===cd.id), O=S.expenses.filter(e=>e.card!==cd.id && e.imported), used=new Set(), seen=new Set(), out=[];
  const invs=[...o.invoices].sort((a,b)=>a.D<b.D?-1:1);
  for(const inv of invs){
    IMP={card:cd.id,D:inv.D,items:[]};
    const its=buildImportItems(inv.rows), m={D:inv.D,items:[],dupApp:0,dupParc:0,already:invoiceImpact(cd.id,inv.D).all.length,use:!off.has(inv.D)};
    if(!m.use){ out.push(m); continue; }
    its.forEach((it,j)=>{ const r=inv.rows[j]; if(it.credit) return;
      it.catName=r.cat; it.whoName=r.who; it.rec=false;
      const pk=[r.who,it.key,it.value,it.n,it.date].join("|");
      if(it.n>1){ if(seen.has(pk)){ m.dupParc++; return; } seen.add(pk); }
      const e=E.find(e=>!used.has(e.id) && e.n===it.n && Math.abs(e.total-it.total)<=(Math.abs(it.total)<5?0.005:0.05) && Math.abs(Math.round((Date.parse(e.date)-Date.parse(it.date))/864e5))<=(it.n>1?45:3) && (e.title===it.title || sameShop(merchantKey(e.title),it.key)))
        || (it.dup && E.find(e=>!used.has(e.id) && e.rec && merchantKey(e.title)===it.key && Math.abs(e.total-it.total)<0.02));
      if(e){ used.add(e.id); it.match=e; m.dupApp++; }
      else { // o mesmo gasto, idêntico, lançado em OUTRO cartão (importação feita no cartão errado)
        const w=O.find(e=>!used.has(e.id) && e.title===it.title && e.n===it.n && Math.abs(e.total-it.total)<0.005 && Math.abs(Math.round((Date.parse(e.date)-Date.parse(it.date))/864e5))<=(it.n>1?45:3));
        if(w){ used.add(w.id); it.wrong=w; } }
      m.items.push(it); });
    m.bank=r2(inv.rows.reduce((a,r)=>a+(r.credit?-1:1)*(kindOf(r)==="payinv"?0:r.value),0));
    out.push(m);
  }
  // o que está no app nessas faturas e NÃO está no arquivo (ex.: importado em dobro ou no cartão errado)
  for(const m of out){ if(!m.use) continue; const seenE=new Set();
    m.extra=installments().filter(x=>x.cd.id===cd.id && x.inv===m.D && !used.has(x.e.id) && Math.abs(x.value)>0.004 && !seenE.has(x.e.id) && seenE.add(x.e.id)); }
  IMP=null; return out;
}

      ${S.cards.length>1?`<span class="small">Vai entrar no cartão <b>${esc(cd.name)}</b>. Confira antes de importar.</span>`:""}

        <div class="impt"><b>Fatura de ${invLabel(m.D)}</b>${m.use?`<span class="num">${nw.length} novos · ${money(r2(nw.reduce((a,i)=>a+i.value,0)))} · banco ${money(m.bank)}</span>`:`<span class="small">Fica de fora desta importação</span>`}
        ${m.use?"":"<!--"}<span class="small">${m.dupApp?`${m.dupApp} já estavam no app · `:""}${m.dupParc?`${m.dupParc} parcelas de compras de meses anteriores · `:""}${m.already?`o app já tem ${m.already} lançamentos nesta fatura`:"nada lançado nesta fatura ainda"}</span>${m.use?"":"-->"}</div></div>`;}).join("")}</div>
      ${(()=>{ const ex=sel.flatMap(m=>(m.extra||[]).map(x=>({x,D:m.D}))); if(!ex.length) return "";
        const okN=sel.reduce((a,m)=>a+m.dupApp,0), suspect=ex.length>15 && ex.length>okN*0.3;

      <span class="small">Também ensina ao Gastô ${(o.rules||[]).length} lojas, para as próximas faturas já virem classificadas.</span>
      ${(()=>{ const n=S.expenses.filter(e=>e.card===cd.id).length; return n?`<details class="okdet"><summary>Ficou bagunçado? Começar do zero no ${esc(cd.name)}</summary>
        <span class="small">Apaga <b>todos os ${n} gastos do ${esc(cd.name)}</b> (de todos os meses, inclusive os lançados à mão) e deixa pronto para importar este arquivo limpo. Os outros cartões não mudam. Faça um backup antes, por segurança.</span>
        <button class="btn dan" id="l_wipe">Apagar os ${n} gastos do ${esc(cd.name)}</button></details>`:""; })()}
      <div class="btns"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="l_ok" ${news.length||matches.length?"":"disabled"}>Importar</button></div>`,
    L=>{ const $=id=>document.getElementById(id);
      L.querySelectorAll("[data-lcd]").forEach(b=>b.onclick=()=>{ LT.card=b.dataset.lcd; LT.months=lotePrep(o,LT.card,LT.off); keepScroll(draw); });
      L.querySelectorAll("[data-lm]").forEach(b=>b.onchange=()=>{ const D=LT.months[+b.dataset.lm].D; if(b.checked) LT.off.delete(D); else LT.off.add(D); LT.months=lotePrep(o,LT.card,LT.off); keepScroll(draw); });
      if($("l_upd")) $("l_upd").onchange=e=>{ LT.upd=e.target.checked; };
      L.querySelectorAll("[data-ldel]").forEach(b=>b.onchange=()=>{ LT.del[b.dataset.ldel]=b.checked; keepScroll(draw); });
      if($("l_del")) $("l_del").onclick=()=>{ const ex=sel.flatMap(m=>(m.extra||[]).map(x=>({x,D:m.D}))).filter(({x})=>LT.del[x.e.id]);
        confirmSheet(`Apagar ${ex.length} lançamentos?`,`Saem do ${cd.name} os que não estão nas faturas do banco. Parcelada sai inteira; recorrente sai só daquela fatura.`,"Apagar",()=>{
          const del=new Set(); for(const {x,D} of ex){ if(x.rec){ x.e.rec.skip=[...new Set([...(x.e.rec.skip||[]),D])]; } else del.add(x.e.id); }
          S.expenses=S.expenses.filter(e=>!del.has(e.id)); save(); render(); toast(`${ex.length} lançamentos apagados`);
          LT.months=lotePrep(o,LT.card,LT.off); draw(); }); };
      if($("l_wipe")) $("l_wipe").onclick=()=>{ const n=S.expenses.filter(e=>e.card===cd.id).length;
        confirmSheet(`Apagar ${n} gastos do ${cd.name}?`,`Todos os gastos do ${cd.name} saem do app${CLOUD.on?", para todos do ambiente":""}. Depois é só tocar em Importar.`,"Apagar tudo do cartão",()=>{
