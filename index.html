function loteFromText(txt,cardId){ let o; try{ o=JSON.parse(txt); }catch{ return false; } if(!o||o.app!=="gasto-lote"||!Array.isArray(o.invoices)) return false; loteSheet(o,cardId); return true; }

/* lixeira: gastos apagados ficam guardados na nuvem (marcados como apagados) e podem voltar */
async function trashFetch(){ const out=[]; const since=new Date(Date.now()-30*864e5).toISOString();
  for(let from=0;;from+=1000){ const {data,error}=await CLOUD.sb.from("items").select("id,data,updated_at").eq("family_id",CLOUD.fam.id).eq("kind","expense").eq("deleted",true).gte("updated_at",since).order("updated_at",{ascending:false}).range(from,from+999);
    if(error) throw error; out.push(...data); if(data.length<1000) break; } return out; }
async function trashSheet(){
  if(!CLOUD.on){ sheet(`${head("Recuperar gastos apagados")}<p class="small" style="margin:0">Só funciona no app com login (os apagados ficam guardados na nuvem).</p><div class="btns"><button class="btn" data-close>Fechar</button></div>`); return; }
  sheet(`${head("Recuperar gastos apagados")}<p class="small" style="margin:0">Buscando na nuvem…</p>`);
  let rows; try{ rows=await trashFetch(); }catch(e){ return sheet(`${head("Recuperar gastos apagados")}<p class="small" style="margin:0">Não consegui buscar agora (${esc(e.message||"sem internet")}). Tente de novo com internet.</p><div class="btns"><button class="btn" data-close>Fechar</button></div>`); }
  trashShow(rows);
}
function trashShow(rows){
  const have=new Set(S.expenses.map(e=>e.id)), same=e=>S.expenses.some(x=>x.card===e.card&&x.title===e.title&&x.n===e.n&&Math.abs(x.total-e.total)<0.005&&x.date===e.date);
  const G={};
  for(const r of rows){ const e=r.data; if(!e||have.has(r.id)||!S.cards.some(c=>c.id===e.card)) continue; e.id=r.id;
    const cd=cardOf(e.card), D=invoiceFor(cd,e.date), k=cd.id+"|"+D;
    (G[k]=G[k]||{cd,D,items:[],dup:0,when:r.updated_at}).items.push(e); if(same(e)) G[k].dup++; if(r.updated_at>G[k].when) G[k].when=r.updated_at; }
  const gs=Object.values(G).sort((a,b)=>a.cd.name<b.cd.name?-1:a.cd.name>b.cd.name?1:a.D<b.D?1:-1), pick={};
  const draw=()=>{ const sel=gs.filter((g,j)=>pick[j]), n=sel.reduce((a,g)=>a+g.items.length-g.dup,0);
    sheet(`${head("Recuperar gastos apagados")}
      <p class="small" style="margin:0">Gastos apagados nos últimos 30 dias, por cartão e fatura (pela data da compra). Marque só o que quer de volta. O que já está no app de novo (igual) não volta em dobro.</p>
      ${gs.length?`<div class="implist">${gs.map((g,j)=>{ const live=g.items.length-g.dup, tot=r2(g.items.reduce((a,e)=>a+e.total,0)), w=new Date(g.when);
        return `<div class="impr${pick[j]?"":" off"}"><label class="impck"><input type="checkbox" data-tp="${j}" ${pick[j]?"checked":""} ${live?"":"disabled"}></label>
        <div class="impt"><b>${esc(g.cd.name)} · compras da fatura de ${invLabel(g.D)}</b><span class="num">${g.items.length} gastos · ${money(tot)}</span>
        <span class="small">${g.dup?`${g.dup} já estão no app de novo · `:""}apagado em ${pad(w.getDate())}/${pad(w.getMonth()+1)} às ${pad(w.getHours())}:${pad(w.getMinutes())}</span>
        ${pick[j]?`<span class="small">${g.items.slice(0,6).map(e=>esc(e.title)).join(", ")}${g.items.length>6?"…":""}</span>`:""}</div></div>`; }).join("")}</div>`
      :`<div class="rsum"><b>Nada para recuperar</b><span class="small">Não há gastos apagados nos últimos 30 dias.</span></div>`}
      <div class="btns"><button class="btn" data-close>Fechar</button><button class="btn pri" id="t_ok" ${n?"":"disabled"}>Recuperar ${n||""}</button></div>`,
    L=>{ L.querySelectorAll("[data-tp]").forEach(b=>b.onchange=()=>{ pick[+b.dataset.tp]=b.checked; keepScroll(draw); });
      const ok=document.getElementById("t_ok"); if(ok) ok.onclick=()=>{ let k=0;
        for(const g of sel) for(const e of g.items){ if(S.expenses.some(x=>x.id===e.id)||same(e)) continue;
          if(!S.categories.some(c=>c.id===e.cat)) e.cat=S.categories[0].id; if(!S.people.some(p=>p.id===e.who)) e.who=S.currentUser; S.expenses.push(e); k++; }
        save(); render(); closeLayer(); toast(`${k} gastos recuperados`); }; }); };
  draw();
}

/* pesquisa: acha uma compra pelo nome, categoria, pessoa ou valor — na fatura aberta na tela ou em todos os meses */
const SRCH={q:"",all:false};
function searchSheet(){
  const inv=V.inv, cardSel=V.card;
  const draw=()=>{
    sheet(`${head("Procurar compra")}
      <input id="sq" type="search" placeholder="Nome da loja, categoria, pessoa ou valor" value="${esc(SRCH.q)}" autocomplete="off" enterkeyhint="search" style="width:100%">
      <span class="seg" role="group" aria-label="Onde procurar"><button data-sa="0" aria-pressed="${!SRCH.all}">Fatura de ${invLabel(inv)}</button><button data-sa="1" aria-pressed="${SRCH.all}">Todos os meses</button></span>
      ${cardSel!=="all"&&S.cards.length>1?`<span class="small">Só no ${esc(cardOf(cardSel).name)} (o cartão filtrado na tela)</span>`:""}
      <div id="sres"></div>
      <div class="btns"><button class="btn" data-close>Fechar</button></div>`,
    L=>{ const q=L.querySelector("#sq");
      q.oninput=()=>{ SRCH.q=q.value; results(); };
      L.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{ SRCH.all=b.dataset.sa==="1"; draw(); });
      results(); setTimeout(()=>{ try{ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }catch{} },60); });
  };
  const results=()=>{
    const box=document.getElementById("sres"); if(!box) return;
    const raw=SRCH.q.trim(), n=normTxt(raw); if(!n){ box.innerHTML=`<span class="small">Digite para procurar${SRCH.all?" em todos os meses":` na fatura de ${invLabel(inv)}`}.</span>`; return; }
    const num=/^\d{1,3}(\.\d{3})*(,\d{1,2})?$|^\d+([.,]\d{1,2})?$/.test(raw) ? parseFloat(raw.replace(/\./g,"").replace(",",".")) : null;
    const words=n.split(/\s+/).filter(Boolean);
    const hit=(e,val)=>{ const txt=normTxt([e.title,catOf(e.cat).name,nameOf(e.who),cardOf(e.card).name].join(" "));
      if(num!=null){ const cents=/[.,]\d{1,2}$/.test(raw); return [e.total,val].some(v=>v!=null && (cents?Math.abs(Math.abs(v)-num)<0.005:Math.floor(Math.abs(v))===Math.floor(num))) || words.every(w=>txt.includes(w)); }
      return words.every(w=>txt.includes(w)); };
    const xs=installments().filter(x=>(cardSel==="all"||x.cd.id===cardSel) && (SRCH.all || x.inv===inv));
    let rows;
    if(SRCH.all){ const seen=new Map(); for(const x of xs){ if(!hit(x.e,x.value)) continue; if(!seen.has(x.e.id)) seen.set(x.e.id,x); }
      rows=[...seen.values()].sort((a,b)=>b.e.date.localeCompare(a.e.date)); }
    else rows=xs.filter(x=>hit(x.e,x.value)).sort((a,b)=>b.e.date.localeCompare(a.e.date));
    const tot=r2(rows.reduce((a,x)=>a+(SRCH.all&&!x.rec?x.e.total:x.value),0)), more=rows.length>200;
    box.innerHTML = rows.length ? `<div class="rsum num"><b>${rows.length} ${rows.length===1?"compra":"compras"} · ${money(tot)}</b><span class="small">${SRCH.all?"valor total de cada compra (parceladas inteiras)":`o que cai na fatura de ${invLabel(inv)}`}</span></div>
      <div class="list">${rows.slice(0,200).map(x=>SRCH.all?searchRow(x):itemRow(x)).join("")}</div>${more?`<span class="small">Mostrando as 200 mais recentes. Digite mais para afinar.</span>`:""}`
      : `<div class="rsum"><b>Nada encontrado</b><span class="small">${SRCH.all?"Tente outra palavra ou parte do nome.":`Não achei na fatura de ${invLabel(inv)}. Quer procurar em todos os meses?`}</span></div>${SRCH.all?"":`<button class="btn" id="s_all">Procurar em todos os meses</button>`}`;
    box.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>expenseSheet(b.dataset.exp));
    const sa=document.getElementById("s_all"); if(sa) sa.onclick=()=>{ SRCH.all=true; draw(); };
  };
  draw();
}
function searchRow(x){ // em "todos os meses": uma linha por compra, com a fatura em que começa
  const e=x.e, c=catOf(e.cat), multi=S.cards.length>1, first=invoiceFor(x.cd,e.date);
  return `<button class="it" data-exp="${e.id}">
    <span class="who" style="background:${colorOf(e.who)}">${esc(nameOf(e.who)[0])}</span>
    <span class="t"><b>${esc(e.title)}${e.n>1?`<span class="tag num">${e.n}x</span>`:""}${x.rec?`<span class="tag">↻ mensal</span>`:""}${e.total<0?`<span class="tag">estorno</span>`:""}</b>
    <span>${br(e.date)} · ${x.rec?`todo mês desde ${invShort(first)}`:`fatura de ${invShort(first)}`} · ${esc(c.name)}${multi?` · <span class="cardname"><span class="mini" style="background:${x.cd.color}"></span>${esc(x.cd.name)}</span>`:""}</span></span>
    <span class="v num">${money(x.rec?x.value:e.total)}</span></button>`;
}

/* lançar pelo SMS do banco: cole uma ou várias mensagens ("Compra aprovada no … p/ NOME - LOJA valor R$ 10,00 em 16/10/2026 as 14h25") */
function parseSms(txt){
  const out=[], t=String(txt||"").replace(/\s+/g," ");
  // Itaú: Compra aprovada no CARTÃO p/ NOME - LOJA valor RS 682,81 em 16/10/2026 as 14h25
  const re=/compra aprovada (?:no|na|com o|com a)?\s*(.+?)\s+p\/\s*(.+?)\s+-\s+(.+?)\s+valor\s+R[S$]\s*([\d.]+,\d{2})\s+em\s+(\d{2})\/(\d{2})(?:\/(\d{2,4}))?(?:\s*[aà]s?\s*(\d{1,2})[h:](\d{2}))?/gi;
  let m; while((m=re.exec(t))){ const y=m[7]?(m[7].length===2?"20"+m[7]:m[7]):String(new Date().getFullYear());
    out.push({card:m[1].trim(), holder:m[2].trim(), desc:m[3].trim(), value:parseMoneyBR(m[4]), date:`${y}-${m[6]}-${m[5]}`, time:m[8]?`${pad(+m[8])}:${m[9]}`:""}); }
  if(out.length) return out;
  // genérico: "… LOJA … R$ 10,00 … 16/10" (um gasto por linha/mensagem)
  for(const part of String(txt||"").split(/\n(?=\S)|(?=compra aprovada)/i)){ const p=part.replace(/\s+/g," ").trim(); if(!p) continue;
    const v=/R[S$]\s*([\d.]+,\d{2})/i.exec(p); if(!v) continue; const d=/(\d{2})\/(\d{2})(?:\/(\d{2,4}))?/.exec(p);
    const y=d&&d[3]?(d[3].length===2?"20"+d[3]:d[3]):String(new Date().getFullYear());
    const lo=(/(?:em|no|na)\s+([A-Z0-9*][A-Z0-9 *.&'-]{2,40}?)(?:\s+(?:valor|no valor|de R)|\s*,)/.exec(p)||[])[1];
    out.push({card:"", holder:"", desc:(lo||"Compra").trim(), value:parseMoneyBR(v[1]), date:d?`${y}-${d[2]}-${d[1]}`:todayStr(), time:""}); }
  return out;
}
function smsSheet(txt0){
  S.smsMap=S.smsMap||{cards:{},people:{}};
  const M=S.smsMap; let txt=txt0||"", items=[];
  const firstName=s=>normTxt(s).split(/\s+/)[0];
  const build=()=>{ items=parseSms(txt).map(r=>{ const key=merchantKey(r.desc), g=guessCat(r.desc,"");
      return {...r, key, title:niceTitle(r.desc), cat:g?g.cat:null, why:g?g.why:"", use:true}; }); };
  const cardFor=n=>M.cards[n]&&S.cards.some(c=>c.id===M.cards[n])?M.cards[n]:(S.cards.length===1?S.cards[0].id:null);
  const whoFor=n=>{ if(!n) return S.currentUser; const s=M.people[n]; if(s===SKIP||(s&&S.people.some(p=>p.id===s))) return s; const p=S.people.find(p=>firstName(p.name)===firstName(n)); return p?p.id:null; };
  const dupOf=i=>{ const cd=cardFor(i.card)||(V.card!=="all"?V.card:S.mainCard); return S.expenses.some(e=>e.card===cd && Math.abs(Math.abs(e.total)-i.value)<0.005 && Math.abs(Math.round((Date.parse(e.date)-Date.parse(i.date))/864e5))<=1 && (e.title===i.title||sameShop(merchantKey(e.title),i.key))); };
  const draw=()=>{ if(txt&&!items.length) build();
    const cardsN=[...new Set(items.map(i=>i.card).filter(Boolean))], peopleN=[...new Set(items.map(i=>i.holder).filter(Boolean))];
    const needCard=cardsN.filter(n=>!cardFor(n)), needWho=peopleN.filter(n=>!whoFor(n));
    items.forEach(i=>{ i.dup=dupOf(i); i.skip=whoFor(i.holder)===SKIP; });
    const live=items.filter(i=>i.use&&!i.dup&&!i.skip), noCat=live.filter(i=>!i.cat).length;
    const catOpts=sel=>`<option value="">Escolher…</option>`+S.categories.map(c=>`<option value="${c.id}"${c.id===sel?" selected":""}>${esc(c.name)}</option>`).join("");
    sheet(`${head("Lançar pelo SMS do banco")}
      <p class="small" style="margin:0">No app Mensagens, toque e segure no SMS de compra → <b>Copiar</b>. Depois toque em <b>Colar</b> aqui. Dá para colar várias mensagens de uma vez.</p>
      <div class="btns" style="margin:0"><button class="btn pri" id="m_paste">📋 Colar</button>${txt?`<button class="btn" id="m_clear">Limpar</button>`:""}</div>
      <textarea id="m_txt" rows="${txt?3:4}" placeholder="Compra aprovada no … p/ NOME - LOJA valor R$ 10,00 em 16/10/2026 as 14h25.">${esc(txt)}</textarea>
      ${needCard.map(n=>`<div class="field hcard"><span class="flabel">“${esc(n)}” é qual cartão?</span><div class="catpick">${S.cards.map(c=>`<button data-mc="${esc(n)}" data-v="${c.id}"><span class="mini" style="background:${c.color}"></span>${esc(c.name)}</button>`).join("")}</div></div>`).join("")}
      ${needWho.map(n=>`<div class="field hcard"><span class="flabel">De quem é “${esc(n)}”?</span><div class="catpick">${S.people.map(p=>`<button data-mw="${esc(n)}" data-v="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join("")}<button class="skipc" data-mw="${esc(n)}" data-v="${SKIP}">Não lançar</button></div></div>`).join("")}
      ${items.length?`<div class="implist">${items.map((i,k)=>`<div class="impr${i.use&&!i.dup&&!i.skip?"":" off"}"><label class="impck"><input type="checkbox" data-mu="${k}" ${i.use&&!i.dup&&!i.skip?"checked":""} ${i.dup||i.skip?"disabled":""}></label>
        <div class="impt"><b>${esc(i.title)}</b><span class="num">${brFull(i.date)}${i.time?` ${i.time}`:""} · ${money(i.value)}${i.holder&&whoFor(i.holder)&&!i.skip?` · ${esc(nameOf(whoFor(i.holder)))}`:""}${i.card&&cardFor(i.card)?` · ${esc(cardOf(cardFor(i.card)).name)}`:""}</span>
        ${i.dup?`<span class="small">Já está lançado no app</span>`:i.skip?`<span class="small">Fica de fora (${esc(i.holder)})</span>`:`<div class="impc"><select data-mcat="${k}" aria-label="Categoria">${catOpts(i.cat)}</select></div>`}</div></div>`).join("")}</div>`
        :txt?`<div class="rsum"><b>Não achei compra nesse texto</b><span class="small">Cole o SMS de "Compra aprovada" do banco.</span></div>`:""}
      <div class="btns"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="m_ok" ${live.length&&!noCat&&!needCard.length&&!needWho.length?"":"disabled"}>${live.length?`Lançar ${live.length}`:"Lançar"}</button></div>`,
    L=>{ const $=id=>document.getElementById(id);
      $("m_paste").onclick=async()=>{ try{ const t=await navigator.clipboard.readText(); if(!t){ toast("Nada copiado ainda"); return; } txt=t; build(); keepScroll(draw); }catch{ toast("Cole com toque longo no campo de texto"); $("m_txt").focus(); } };
      if($("m_clear")) $("m_clear").onclick=()=>{ txt=""; items=[]; draw(); };
      $("m_txt").oninput=e=>{ clearTimeout(smsSheet._t); smsSheet._t=setTimeout(()=>{ txt=e.target.value; build(); keepScroll(draw); },500); };
      L.querySelectorAll("[data-mc]").forEach(b=>b.onclick=()=>{ M.cards[b.dataset.mc]=b.dataset.v; save(); keepScroll(draw); });
      L.querySelectorAll("[data-mw]").forEach(b=>b.onclick=()=>{ M.people[b.dataset.mw]=b.dataset.v; save(); keepScroll(draw); });
      L.querySelectorAll("[data-mu]").forEach(b=>b.onchange=()=>{ items[+b.dataset.mu].use=b.checked; keepScroll(draw); });
      L.querySelectorAll("[data-mcat]").forEach(s=>s.onchange=()=>{ const i=items[+s.dataset.mcat]; i.cat=s.value||null;
        if(i.cat){ S.rules=S.rules||[]; const r=S.rules.find(x=>x.k===i.key); if(r) r.cat=i.cat; else S.rules.push({k:i.key,cat:i.cat}); items.forEach(x=>{ if(x!==i&&!x.cat&&sameShop(x.key,i.key)) x.cat=i.cat; }); }
        keepScroll(draw); });
      $("m_ok").onclick=()=>{ let k=0; for(const i of items){ if(!i.use||i.dup||i.skip||!i.cat) continue;
          S.expenses.push({id:uid(),title:i.title,cat:i.cat,total:i.value,n:1,date:i.date,who:whoFor(i.holder)||S.currentUser,card:cardFor(i.card)||(V.card!=="all"?V.card:S.mainCard),sms:true}); k++; }
        save(); render(); closeLayer(); toast(`${k} ${k===1?"gasto lançado":"gastos lançados"} pelo SMS`); };
    }); };
  if(txt) build(); draw();
}
// um toque: lê o que foi copiado (no iPhone aparece o balão "Colar") e já abre com as compras
async function smsQuick(){ let t=""; try{ t=await navigator.clipboard.readText(); }catch{}
  if(t && /compra aprovada|R[S$]\s*[\d.]+,\d{2}/i.test(t)) smsSheet(t); else { smsSheet(); if(t!==null) toast("Copie o SMS de compra do banco e toque em Colar"); } }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("#f_sms"); if(b){ e.preventDefault(); smsQuick(); } });
// abrir já numa tela: compartilhado de outro app (Android) ou vindo de uma notificação
const OPEN_AT=(()=>{ try{ const q=new URLSearchParams(location.search), t=[q.get("title"),q.get("text")].filter(Boolean).join(" "); const h=location.hash;
  if(t||h==="#novo"||h==="#sms"){ history.replaceState(null,"",location.pathname); return t?{sms:t}:h==="#sms"?{sms:""}:{add:true}; } }catch{} return null; })();
let openAtDone=false;
function openAtOnce(){ if(openAtDone||!OPEN_AT||!S.categories.length) return; openAtDone=true; setTimeout(()=>{ if(OPEN_AT.add) addSheet(); else smsSheet(OPEN_AT.sms); },300); }

async function boot(){
  if(!CLOUD_CFG.url || !CLOUD_CFG.key || !window.supabase){ render(); return; }
  CLOUD.sb=window.supabase.createClient(CLOUD_CFG.url, CLOUD_CFG.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"gasto-auth"}});
  let session=null; try{ ({data:{session}}=await CLOUD.sb.auth.getSession()); }catch{}
  if(!session){ // sem sessão: se tiver dados guardados e estiver sem internet, abre mesmo assim
    return authView(); }
  CLOUD.user=session.user; afterLogin();
}

boot();

const fab2=document.createElement("button");fab2.className="fab2";fab2.innerHTML="<span aria-hidden='true'>📩</span> SMS";fab2.setAttribute("aria-label","Lançar pelo SMS do banco");fab2.onclick=smsQuick;
const fab=document.createElement("button");fab.className="fab";fab.innerHTML="<span aria-hidden='true' style='font-size:20px;line-height:1'>+</span> Gasto";fab.onclick=addSheet;
fabg.append(fab2,fab);document.body.appendChild(fabg);
</script>
